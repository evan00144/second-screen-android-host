plugins {
    id 'com.android.application'
}

def releaseMetadata = new groovy.json.JsonSlurper().parse(rootProject.file('../../version.json'))

android {
    namespace 'com.secondscreen.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.secondscreen.android'
        minSdk 29
    targetSdk 35
        versionCode releaseMetadata.versionCode as int
        versionName releaseMetadata.version as String
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
