plugins {
    id 'com.android.application'
}

android {
    namespace 'com.secondscreen.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.secondscreen.android'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
